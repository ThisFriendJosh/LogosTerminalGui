name: Validate terminal host

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install development schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate module and theme schemas
        run: python tools/check_schemas.py
      - name: Test host, transport and independent connector
        run: python -m unittest discover -v
      - name: Check Linux GUI layout under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest -v tests.test_gui_layout tests.test_terminal_manager
      - name: Check source compilation
        run: python -m compileall -q terminal_gui.py terminal_core.py terminal_protocol.py terminal_themes.py terminal_visuals.py galactic_rain.py terminal_manager.py terminal_diagnostics.py validate_terminal.py terminals terminal_sdk tools
